# =============================================================================
#  HARVEST PACK: 2026-10-07 four Fall alternate icons (maple/pumpkin/hayride/frost) fetched from the live site (appicons/season2),
#                and the app now announces its icon list to the page as window.__shellIcons.
#  Icon refresh: 2026-08-30 re-pick — cleaner SUNSET CRUISER/SURF VAN/THE WOODY/GOLDEN HOUR art at the same URLs.
#  Icon refresh: 2026-08-30 SUMMER PACK art (4 hand-made icons replace the generated set at the same URLs).
#  MotorDex -> your iPhone, in ONE file.
#
#  This is the whole build. It carries the app's source inside it, so there is
#  nothing else to upload and no hidden .github folder to hunt for on Windows.
#
#  HOW TO RUN IT
#    1. "Actions" tab at the top of this repo
#    2. "Build iOS IPA" in the left sidebar
#    3. "Run workflow" button on the right -> Run workflow
#    4. Wait ~5 minutes. Open the finished run, scroll down to "Artifacts".
#    5. Download it, unzip, and open MotorDex.ipa in SideStore.
#
#  You do this ONCE. The app is a shell that loads the live site, so every
#  future change to the website shows up in the app on next launch - no rebuild.
#
#  The IPA is unsigned on purpose: SideStore signs it with YOUR Apple ID when
#  you install it. That is what lets this build with no Mac, no Xcode and no
#  Apple developer account.
#
#  The two source files are base64 below rather than pasted as readable text: a
#  shell heredoc needs its terminator at column 0, which would end the YAML
#  block early, and YAML forbids the tabs that <<- would need instead.
# =============================================================================
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    # macos-15, not macos-14. The 14 image ships Xcode 15.4, which could not
    # read the project a current XcodeGen writes ("Unable to read project") -
    # a newer Xcode reads older formats fine, so the newer image is the safe
    # side of that mismatch.
    runs-on: macos-15
    steps:
      - name: Write the app source
        run: |
          mkdir -p ios/Sources \
            ios/Assets.xcassets/AppIcon.appiconset \
            ios/Assets.xcassets/AppIconBeach.appiconset \
            ios/Assets.xcassets/AppIconDesert.appiconset \
            ios/Assets.xcassets/AppIconBoardwalk.appiconset \
            ios/Assets.xcassets/AppIconSurfvan.appiconset \
            ios/Assets.xcassets/AppIconDunebuggy.appiconset \
            ios/Assets.xcassets/AppIconDrivein.appiconset \
            ios/Assets.xcassets/AppIconMaple.appiconset \
            ios/Assets.xcassets/AppIconPumpkin.appiconset \
            ios/Assets.xcassets/AppIconHayride.appiconset \
            ios/Assets.xcassets/AppIconFrost.appiconset
          echo '' | base64 -d > ios/project.yml
          echo '' | base64 -d > ios/Sources/AppDelegate.swift
          echo 'ewogICJpbWFnZXMiOiBbCiAgICB7CiAgICAgICJmaWxlbmFtZSI6ICJpY29uLTEwMjQucG5nIiwKICAgICAgImlkaW9tIjogInVuaXZlcnNhbCIsCiAgICAgICJwbGF0Zm9ybSI6ICJpb3MiLAogICAgICAic2l6ZSI6ICIxMDI0eDEwMjQiCiAgICB9CiAgXSwKICAiaW5mbyI6IHsKICAgICJhdXRob3IiOiAieGNvZGUiLAogICAgInZlcnNpb24iOiAxCiAgfQp9' | base64 -d > ios/Assets.xcassets/AppIcon.appiconset/Contents.json
          echo 'eyJpbmZvIjp7ImF1dGhvciI6Inhjb2RlIiwidmVyc2lvbiI6MX19' | base64 -d > ios/Assets.xcassets/Contents.json
          echo 'ewogICJpbWFnZXMiOiBbCiAgICB7CiAgICAgICJmaWxlbmFtZSI6ICJpY29uLWJlYWNoLnBuZyIsCiAgICAgICJpZGlvbSI6ICJ1bml2ZXJzYWwiLAogICAgICAicGxhdGZvcm0iOiAiaW9zIiwKICAgICAgInNpemUiOiAiMTAyNHgxMDI0IgogICAgfQogIF0sCiAgImluZm8iOiB7CiAgICAiYXV0aG9yIjogInhjb2RlIiwKICAgICJ2ZXJzaW9uIjogMQogIH0KfQo=' | base64 -d > ios/Assets.xcassets/AppIconBeach.appiconset/Contents.json
          echo 'ewogICJpbWFnZXMiOiBbCiAgICB7CiAgICAgICJmaWxlbmFtZSI6ICJpY29uLWRlc2VydC5wbmciLAogICAgICAiaWRpb20iOiAidW5pdmVyc2FsIiwKICAgICAgInBsYXRmb3JtIjogImlvcyIsCiAgICAgICJzaXplIjogIjEwMjR4MTAyNCIKICAgIH0KICBdLAogICJpbmZvIjogewogICAgImF1dGhvciI6ICJ4Y29kZSIsCiAgICAidmVyc2lvbiI6IDEKICB9Cn0K' | base64 -d > ios/Assets.xcassets/AppIconDesert.appiconset/Contents.json
          echo 'ewogICJpbWFnZXMiOiBbCiAgICB7CiAgICAgICJmaWxlbmFtZSI6ICJpY29uLWJvYXJkd2Fsay5wbmciLAogICAgICAiaWRpb20iOiAidW5pdmVyc2FsIiwKICAgICAgInBsYXRmb3JtIjogImlvcyIsCiAgICAgICJzaXplIjogIjEwMjR4MTAyNCIKICAgIH0KICBdLAogICJpbmZvIjogewogICAgImF1dGhvciI6ICJ4Y29kZSIsCiAgICAidmVyc2lvbiI6IDEKICB9Cn0K' | base64 -d > ios/Assets.xcassets/AppIconBoardwalk.appiconset/Contents.json
          echo 'ewogICJpbWFnZXMiOiBbCiAgICB7CiAgICAgICJmaWxlbmFtZSI6ICJpY29uLXN1cmZ2YW4ucG5nIiwKICAgICAgImlkaW9tIjogInVuaXZlcnNhbCIsCiAgICAgICJwbGF0Zm9ybSI6ICJpb3MiLAogICAgICAic2l6ZSI6ICIxMDI0eDEwMjQiCiAgICB9CiAgXSwKICAiaW5mbyI6IHsKICAgICJhdXRob3IiOiAieGNvZGUiLAogICAgInZlcnNpb24iOiAxCiAgfQp9Cg==' | base64 -d > ios/Assets.xcassets/AppIconSurfvan.appiconset/Contents.json
          echo 'ewogICJpbWFnZXMiOiBbCiAgICB7CiAgICAgICJmaWxlbmFtZSI6ICJpY29uLWR1bmVidWdneS5wbmciLAogICAgICAiaWRpb20iOiAidW5pdmVyc2FsIiwKICAgICAgInBsYXRmb3JtIjogImlvcyIsCiAgICAgICJzaXplIjogIjEwMjR4MTAyNCIKICAgIH0KICBdLAogICJpbmZvIjogewogICAgImF1dGhvciI6ICJ4Y29kZSIsCiAgICAidmVyc2lvbiI6IDEKICB9Cn0K' | base64 -d > ios/Assets.xcassets/AppIconDunebuggy.appiconset/Contents.json
          echo 'ewogICJpbWFnZXMiOiBbCiAgICB7CiAgICAgICJmaWxlbmFtZSI6ICJpY29uLWRyaXZlaW4ucG5nIiwKICAgICAgImlkaW9tIjogInVuaXZlcnNhbCIsCiAgICAgICJwbGF0Zm9ybSI6ICJpb3MiLAogICAgICAic2l6ZSI6ICIxMDI0eDEwMjQiCiAgICB9CiAgXSwKICAiaW5mbyI6IHsKICAgICJhdXRob3IiOiAieGNvZGUiLAogICAgInZlcnNpb24iOiAxCiAgfQp9Cg==' | base64 -d > ios/Assets.xcassets/AppIconDrivein.appiconset/Contents.json
          echo 'ewogICJpbWFnZXMiOiBbCiAgICB7CiAgICAgICJmaWxlbmFtZSI6ICJpY29uLW1hcGxlLnBuZyIsCiAgICAgICJpZGlvbSI6ICJ1bml2ZXJzYWwiLAogICAgICAicGxhdGZvcm0iOiAiaW9zIiwKICAgICAgInNpemUiOiAiMTAyNHgxMDI0IgogICAgfQogIF0sCiAgImluZm8iOiB7CiAgICAiYXV0aG9yIjogInhjb2RlIiwKICAgICJ2ZXJzaW9uIjogMQogIH0KfQo=' | base64 -d > ios/Assets.xcassets/AppIconMaple.appiconset/Contents.json
          echo 'ewogICJpbWFnZXMiOiBbCiAgICB7CiAgICAgICJmaWxlbmFtZSI6ICJpY29uLXB1bXBraW4ucG5nIiwKICAgICAgImlkaW9tIjogInVuaXZlcnNhbCIsCiAgICAgICJwbGF0Zm9ybSI6ICJpb3MiLAogICAgICAic2l6ZSI6ICIxMDI0eDEwMjQiCiAgICB9CiAgXSwKICAiaW5mbyI6IHsKICAgICJhdXRob3IiOiAieGNvZGUiLAogICAgInZlcnNpb24iOiAxCiAgfQp9Cg==' | base64 -d > ios/Assets.xcassets/AppIconPumpkin.appiconset/Contents.json
          echo 'ewogICJpbWFnZXMiOiBbCiAgICB7CiAgICAgICJmaWxlbmFtZSI6ICJpY29uLWhheXJpZGUucG5nIiwKICAgICAgImlkaW9tIjogInVuaXZlcnNhbCIsCiAgICAgICJwbGF0Zm9ybSI6ICJpb3MiLAogICAgICAic2l6ZSI6ICIxMDI0eDEwMjQiCiAgICB9CiAgXSwKICAiaW5mbyI6IHsKICAgICJhdXRob3IiOiAieGNvZGUiLAogICAgInZlcnNpb24iOiAxCiAgfQp9Cg==' | base64 -d > ios/Assets.xcassets/AppIconHayride.appiconset/Contents.json
          echo 'ewogICJpbWFnZXMiOiBbCiAgICB7CiAgICAgICJmaWxlbmFtZSI6ICJpY29uLWZyb3N0LnBuZyIsCiAgICAgICJpZGlvbSI6ICJ1bml2ZXJzYWwiLAogICAgICAicGxhdGZvcm0iOiAiaW9zIiwKICAgICAgInNpemUiOiAiMTAyNHgxMDI0IgogICAgfQogIF0sCiAgImluZm8iOiB7CiAgICAiYXV0aG9yIjogInhjb2RlIiwKICAgICJ2ZXJzaW9uIjogMQogIH0KfQo=' | base64 -d > ios/Assets.xcassets/AppIconFrost.appiconset/Contents.json
          curl -fsSL "https://motordex.pages.dev/icon-1024.png" -o ios/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          curl -fsSL "https://motordex.pages.dev/appicons/season1/icon1.png" -o ios/Assets.xcassets/AppIconBeach.appiconset/icon-beach.png
          curl -fsSL "https://motordex.pages.dev/appicons/season1/icon2.png" -o ios/Assets.xcassets/AppIconDesert.appiconset/icon-desert.png
          curl -fsSL "https://motordex.pages.dev/appicons/season1/icon3.png" -o ios/Assets.xcassets/AppIconBoardwalk.appiconset/icon-boardwalk.png
          curl -fsSL "https://motordex.pages.dev/appicons/season1/icon4.png" -o ios/Assets.xcassets/AppIconSurfvan.appiconset/icon-surfvan.png
          curl -fsSL "https://motordex.pages.dev/appicons/season1/icon5.png" -o ios/Assets.xcassets/AppIconDunebuggy.appiconset/icon-dunebuggy.png
          curl -fsSL "https://motordex.pages.dev/appicons/season1/icon6.png" -o ios/Assets.xcassets/AppIconDrivein.appiconset/icon-drivein.png
          curl -fsSL "https://motordex.pages.dev/appicons/season2/icon1.png" -o ios/Assets.xcassets/AppIconMaple.appiconset/icon-maple.png
          curl -fsSL "https://motordex.pages.dev/appicons/season2/icon2.png" -o ios/Assets.xcassets/AppIconPumpkin.appiconset/icon-pumpkin.png
          curl -fsSL "https://motordex.pages.dev/appicons/season2/icon3.png" -o ios/Assets.xcassets/AppIconHayride.appiconset/icon-hayride.png
          curl -fsSL "https://motordex.pages.dev/appicons/season2/icon4.png" -o ios/Assets.xcassets/AppIconFrost.appiconset/icon-frost.png
          echo "wrote:"; find ios -type f | sed 's/^/  /'
          # A missing or half-downloaded icon builds "fine" with no icon at all,
          # which you would only notice on the phone. Fail loudly instead — for
          # the primary icon AND all 6 seasonal alternates.
          for f in ios/Assets.xcassets/AppIcon.appiconset/icon-1024.png \
               ios/Assets.xcassets/AppIconBeach.appiconset/icon-beach.png \
               ios/Assets.xcassets/AppIconDesert.appiconset/icon-desert.png \
               ios/Assets.xcassets/AppIconBoardwalk.appiconset/icon-boardwalk.png \
               ios/Assets.xcassets/AppIconSurfvan.appiconset/icon-surfvan.png \
               ios/Assets.xcassets/AppIconDunebuggy.appiconset/icon-dunebuggy.png \
               ios/Assets.xcassets/AppIconDrivein.appiconset/icon-drivein.png \
               ios/Assets.xcassets/AppIconMaple.appiconset/icon-maple.png \
               ios/Assets.xcassets/AppIconPumpkin.appiconset/icon-pumpkin.png \
               ios/Assets.xcassets/AppIconHayride.appiconset/icon-hayride.png \
               ios/Assets.xcassets/AppIconFrost.appiconset/icon-frost.png; do
            SZ=$(wc -c < "$f")
            echo "::warning::$f bytes $SZ"
            if [ "$SZ" -lt 2000 ]; then echo "::error::$f download failed ($SZ bytes)"; exit 1; fi
          done
          file ios/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Install XcodeGen
        run: brew install xcodegen

      # Everything this step learns is echoed as public annotations, so a
      # failure can be diagnosed without signing in to read the raw log.
      - name: Generate Xcode project
        working-directory: ios
        run: |
          echo "::warning::xcodebuild $(xcodebuild -version | head -1)"
          echo "::warning::xcodegen $(xcodegen --version 2>&1 | head -1)"
          xcodegen generate --spec project.yml 2>&1 | tee gen.log || true
          tail -12 gen.log | while IFS= read -r l; do echo "::warning::gen| $l"; done
          ls -la | while IFS= read -r l; do echo "::warning::ls| $l"; done
          if [ ! -d MotorDex.xcodeproj ]; then
            echo "::error::MotorDex.xcodeproj was never created"; exit 1
          fi
          echo "::warning::objectVersion $(grep -m1 objectVersion MotorDex.xcodeproj/project.pbxproj || echo none)"

      # Viewing raw Actions logs requires being signed in, which makes a failure
      # hard to diagnose from outside. Annotations are public, so the build log
      # is echoed back as ::error:: lines when it fails - the reason for the
      # failure then travels with the run instead of being locked behind login.
      - name: Build (unsigned)
        working-directory: ios
        run: |
          echo "--- targets and schemes in the generated project ---"
          xcodebuild -list -project MotorDex.xcodeproj || true
          set +e
          xcodebuild -project MotorDex.xcodeproj -scheme MotorDex \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build 2>&1 | tee xcb.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" != "0" ]; then
            echo "::error::xcodebuild exited $CODE"
            grep -E "error:|does not contain|No such|cannot find|Undefined symbol" xcb.log \
              | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            tail -25 xcb.log | while IFS= read -r line; do echo "::error::tail| $line"; done
            exit "$CODE"
          fi

      - name: Package IPA
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/MotorDex.app
          test -d "$APP" || { echo "app not found"; ls -R build/Build/Products; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry MotorDex.ipa Payload
          ls -lh MotorDex.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotorDex-ipa
          path: ios/out/MotorDex.ipa
          if-no-files-found: error
