# =============================================================================
#  MotorDex -> your iPhone, in ONE file.
#
#  This is the whole build. It carries the app's source inside it, so there is
#  nothing else to upload and no hidden .github folder to hunt for on Windows.
#
#  HOW TO RUN IT
#    1. "Actions" tab at the top of this repo
#    2. "Build iOS IPA" in the left sidebar
#    3. "Run workflow" button on the right -> Run workflow
#    4. Wait ~5 minutes. Open the finished run, scroll down to "Artifacts".
#    5. Download it, unzip, and open MotorDex.ipa in SideStore.
#
#  You do this ONCE. The app is a shell that loads the live site, so every
#  future change to the website shows up in the app on next launch - no rebuild.
#
#  The IPA is unsigned on purpose: SideStore signs it with YOUR Apple ID when
#  you install it. That is what lets this build with no Mac, no Xcode and no
#  Apple developer account.
#
#  The two source files are base64 below rather than pasted as readable text: a
#  shell heredoc needs its terminator at column 0, which would end the YAML
#  block early, and YAML forbids the tabs that <<- would need instead.
# =============================================================================
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Write the app source
        run: |
          mkdir -p ios/Sources
          echo '' | base64 -d > ios/project.yml
          echo '' | base64 -d > ios/Sources/AppDelegate.swift
          echo "wrote:"; find ios -type f -exec wc -l {} +

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Viewing raw Actions logs requires being signed in, which makes a failure
      # hard to diagnose from outside. Annotations are public, so the build log
      # is echoed back as ::error:: lines when it fails â€” the reason for the
      # failure then travels with the run instead of being locked behind login.
      - name: Build (unsigned)
        working-directory: ios
        run: |
          echo "--- targets and schemes in the generated project ---"
          xcodebuild -list -project MotorDex.xcodeproj || true
          set +e
          xcodebuild -project MotorDex.xcodeproj -scheme MotorDex \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build 2>&1 | tee xcb.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" != "0" ]; then
            echo "::error::xcodebuild exited $CODE"
            grep -E "error:|does not contain|No such|cannot find|Undefined symbol" xcb.log \
              | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            tail -25 xcb.log | while IFS= read -r line; do echo "::error::tail| $line"; done
            exit "$CODE"
          fi

      - name: Package IPA
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/MotorDex.app
          test -d "$APP" || { echo "app not found"; ls -R build/Build/Products; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry MotorDex.ipa Payload
          ls -lh MotorDex.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotorDex-ipa
          path: ios/out/MotorDex.ipa
          if-no-files-found: error
